# lint-expect: L6
# Private-network (WARP) routing switched on.
tunnel: 00000000-0000-4000-8000-000000000000
credentials-file: /run/credentials/cloudflared-hasala.service/tunnel.json
metrics: 127.0.0.1:9472
no-autoupdate: true
loglevel: info
warp-routing:
  enabled: true
transport-loglevel: warn
originRequest:
  connectTimeout: 5s
  noHappyEyeballs: true
  keepAliveConnections: 16
  keepAliveTimeout: 90s
ingress:
  - hostname: api.hasala.app
    path: '^/(api/v1/.*|hooks/gmail/pubsub)$'
    service: http://127.0.0.1:8471
  - service: http_status:404
