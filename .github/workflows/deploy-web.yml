# Deploys hasala.app (web/, Workers Static Assets on the `hasala-aasa` Worker)
# from main, after CI has passed on that commit. See CLAUDE.md, "Website".
#
# It runs when a CI run for a push to main finishes successfully, and by hand
# (workflow_dispatch, main only). It never runs for a pull request, and it
# deploys only the exact commit CI passed: `workflow_run.head_sha`, checked
# out by SHA. A run whose commit is no longer main's head deploys nothing, so
# a slow run can never put an older site back over a newer one; the run for
# the newer commit deploys it.
#
# The Cloudflare credentials are secrets of the `production` environment
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID), which only main can use.
# `bun run deploy` builds first, so the CSP and JS-budget checks gate the
# upload, and web/scripts/verify-live.sh then checks the live site.
#
# Every action is pinned to a full commit SHA, with its release in a comment.
name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; a queued run is replaced by a newer one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hasala.app
    env:
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Is this commit still main's head?
        id: current
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          head="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          if [[ "$head" == "$SHA" ]]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          else
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            echo "::notice::main is at $head, not $SHA: leaving the deploy to that commit's run"
          fi

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.current.outputs.deploy == 'true'
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: steps.current.outputs.deploy == 'true'
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      - name: Install the site's dependencies
        if: steps.current.outputs.deploy == 'true'
        run: nix develop --command bash -c 'cd web && bun install --frozen-lockfile'

      - name: Build and deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command bash -c 'cd web && bun run deploy'

      - name: Check the live site
        if: steps.current.outputs.deploy == 'true'
        run: web/scripts/verify-live.sh https://hasala.app
