# CI for the public tree. It runs WITHOUT the private fixtures
# (HASALA_PRIVATE_FIXTURES is never set here and no private repository is
# fetched), so the real-corpus tests skip by name and scripts/check.sh says how
# many; that is expected. See CLAUDE.md, "Build and test".
#
# The job ids below are also their check names (no `name:` override, no
# matrix): required status checks match `gate`, `vuln` and `secrets` by name,
# so renaming a job silently drops it from the requirement. `web` (the
# website) is not required.
#
# Every action is pinned to a full commit SHA, with its release in a comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request (a new push cancels the superseded run); every push
# to main gets its own group, so no main commit's run is cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before Nix, so it runs on every push even when nothing else can build.
      # check.sh runs it again as its own first step.
      - name: Real-mail fence
        run: scripts/check.sh --fence-only

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Build the devShell
        run: nix develop --command true

      - name: Install the reference client's dependencies
        run: nix develop --command bash -c 'cd reference/ledgerd-client && bun install --frozen-lockfile'

      # The throwaway Postgres runs as the (unprivileged) runner user, inside the
      # devShell's TMPDIR, on a unix socket only: no service container, no TCP.
      - name: scripts/check.sh
        run: nix develop --command scripts/check.sh

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      # govulncheck exits non-zero when any vulnerability is reachable from the
      # code (symbol-level, its default); imported-but-unreachable ones are
      # reported without failing.
      - name: govulncheck ./... (server)
        run: nix develop --command bash -c 'cd server && govulncheck ./...'

      # server/oracle is a separate Go module (spec 02 §4.3) that the scan above
      # never reaches; excelize and modernc.org/sqlite live only there.
      - name: govulncheck ./... (server/oracle)
        run: nix develop --command bash -c 'cd server/oracle && govulncheck ./...'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip: a secret added and then deleted in a
          # later commit is still published.
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""

      # gitleaks from the flake's pinned nixpkgs (flake.lock), so its version
      # moves only with the lock. --redact: this log is public.
      - name: gitleaks
        run: >-
          nix shell --inputs-from . nixpkgs#gitleaks --command
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

  # The hasala.app website in web/ (Astro + Bun). Not a required check: the
  # ruleset is the owner's. Lighthouse uses the Node and Chrome that come with
  # the runner image and keeps its reports in a workflow artifact only (never
  # temporary-public-storage). Nothing here deploys.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      - name: Install the site's dependencies
        run: >-
          nix develop --command bash -c
          'cd web && bun install --frozen-lockfile && cd lighthouse && bun install --frozen-lockfile'

      - name: astro check
        run: nix develop --command bash -c 'cd web && bun run check'

      # `bun run build` is astro build followed by scripts/check-dist.ts: one
      # CSP covering every inline script and style, no style="" attributes,
      # and the JS budget on / (15 KB gzip).
      - name: Build, CSP and JS-budget checks
        run: nix develop --command bash -c 'cd web && bun run build'

      # Serves dist/ on 127.0.0.1 (scripts/serve-dist.ts) and asserts the
      # category scores in web/lighthouse/lighthouserc.json, mobile and desktop.
      - name: Lighthouse CI
        run: nix develop --command web/lighthouse/run.sh "$RUNNER_TEMP/lighthouse"

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: warn
          retention-days: 14
