# CI for the public tree. It runs WITHOUT the private fixtures
# (HASALA_PRIVATE_FIXTURES is never set here and no private repository is
# fetched), so the real-corpus tests skip by name and scripts/check.sh says how
# many; that is expected. See CLAUDE.md, "Build and test".
#
# The job ids below are also their check names (no `name:` override, no
# matrix): required status checks match `gate`, `vuln` and `secrets` by name,
# so renaming a job silently drops it from the requirement. `swift` (the Swift
# client core on a Mac), `ios` (the app on a Mac), `web` (the website) and
# `nixos-vm` (the QA module booted in a NixOS VM) are not required checks.
#
# Path-aware on pull requests, failing closed: the first job, `changes`, lists
# the files the pull request changes, and `gate`, `vuln`, `swift`, `ios`, `web`
# and `nixos-vm` are skipped only when every one of them is on that job's list of
# paths it does not read. Any other path runs the job, a path nobody
# anticipated included. `secrets` always runs. Jobs are skipped with a
# job-level `if:`, never a workflow-level `paths:` filter: a skipped job still
# reports its check, as "skipped", which a required check counts as passing,
# whereas a workflow that never starts leaves its required checks pending
# forever. If `changes` does not succeed, every job runs. A push to main and a
# manual run (workflow_dispatch) run every job. The weekly govulncheck of main
# is a separate workflow, vuln-weekly.yml, so that its run never records checks
# on main's head.
#
# Every action is pinned to a full commit SHA, with its release in a comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (a new push cancels the superseded run); every other
# run (a push to main, a manual run) is its own group, so none is cancelled or
# dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Which jobs the pull request needs, as outputs `gate` (read by gate and
  # vuln), `swift`, `ios`, `web` and `nixos_vm`, each "true" or "false"; any
  # other event sets all of them to "true". The checkout of a pull request is its merge
  # commit (refs/pull/N/merge) and depth 2 fetches both parents, so
  # `git diff HEAD^1 HEAD` is exactly what merging would change on the base as
  # it is now. --no-renames lists both ends of a move, so moving a file out of
  # an area still counts for that area. -z prints every path verbatim,
  # NUL-terminated: without it git C-quotes non-ASCII and special characters
  # ("server/caf\303\251.go") and no anchored pattern matches the line.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.areas.outputs.gate }}
      swift: ${{ steps.areas.outputs.swift }}
      ios: ${{ steps.areas.outputs.ios }}
      web: ${{ steps.areas.outputs.web }}
      nixos_vm: ${{ steps.areas.outputs.nixos_vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            printf '%s=true\n' gate swift ios web nixos_vm | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-paths"
          git diff -z --no-renames --name-only HEAD^1 HEAD >"$changed"
          echo "::group::$(tr -cd '\0' <"$changed" | wc -c) changed path(s)"
          # The paths come from the pull request: between these two lines, a
          # line that starts with "::" is printed, not run as a command.
          token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$token"
          tr '\0' '\n' <"$changed"
          echo "::$token::"
          echo "::endgroup::"
          # skip_unless NAME INERT [READS]: NAME=false only when every changed
          # path matches INERT (paths NAME does not read) and none matches
          # READS (paths under INERT that NAME does read); otherwise true. An
          # empty diff is false. grep -z matches each NUL-terminated path.
          # grep exits 2 on an error (a malformed pattern): fail the step, so
          # `changes` is not 'success' and every job runs.
          match() { local rc=0; grep -zEq "$@" "$changed" || rc=$?; ((rc < 2)) || exit "$rc"; return "$rc"; }
          skip_unless() {
            local v=false
            if match -v -- "$2" || { [[ -n "${3:-}" ]] && match -- "$3"; }; then
              v=true
            fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          # Read by no job: the licence texts, NOTICE, root Markdown, design
          # assets and the private-fixtures pin (read only when
          # HASALA_PRIVATE_FIXTURES is set, which CI never does).
          none='^(LICENSES|design)/|^[^/]+\.md$|^(NOTICE|private-fixtures\.lock)$'
          # gate and vuln: docs/, web/ and ios/ are not read, except any *.go
          # or *.nix (the flake's formatting check covers them wherever they
          # are) and any go.mod, go.sum, go.work or go.work.sum. check.sh also
          # runs the HasalaCore lints over ios/, but `secrets` runs them too.
          # infra/ is read (nix flake check evaluates and builds its checks).
          skip_unless gate "$none|^(docs|web|ios)/" '\.(go|nix)$|(^|/)go\.(mod|sum|work|work\.sum)$'
          # swift reads ios/ and conformance/ only.
          skip_unless swift "$none|^(docs|web|server|reference|scripts|infra)/|^(flake\.nix|flake\.lock|\.gitleaks\.toml)$"
          # ios (the app) reads ios/, design/ (the Paper tokens it is generated
          # from) and the flake (which pins its XcodeGen).
          skip_unless ios '^LICENSES/|^[^/]+\.md$|^(NOTICE|private-fixtures\.lock)$|^(docs|web|server|conformance|reference|scripts|infra)/|^\.gitleaks\.toml$'
          # web reads web/ and docs/legal/, and its Bun comes from the flake.
          skip_unless web "$none|^(docs|ios|server|conformance|reference|scripts|infra)/|^\.gitleaks\.toml$" '^docs/legal/'
          # nixos-vm reads infra/ (the module and the VM test), server/ (the
          # hasalad it boots) and the flake (cloudflared, PostgreSQL and the
          # nixpkgs it builds them from).
          skip_unless nixos_vm "$none|^(docs|web|ios|conformance|reference|scripts)/|^\.gitleaks\.toml$"

  # A skipped required job reports "skipped", which passes. Each job below is
  # skipped only when `changes` succeeded and said "false".
  gate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before Nix, so it runs on every push even when nothing else can build.
      # check.sh runs it again as its own first step.
      - name: Real-mail fence
        run: scripts/check.sh --fence-only

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      # Every check is evaluated, and every check except the NixOS VM test is
      # built. The VM test needs KVM and minutes; it has its own job below
      # (nixos-vm), which is not a required check.
      - name: nix flake check (evaluate everything)
        run: nix flake check --no-build
      - name: nix flake check (build every check but qa-vm)
        run: |
          set -euo pipefail
          checks="$(nix eval --json .#checks.x86_64-linux --apply 'cs: builtins.attrNames (removeAttrs cs [ "qa-vm" ])' \
            | jq -r '.[] | ".#checks.x86_64-linux." + .')"
          echo "$checks"
          # shellcheck disable=SC2086 # one installable per word
          nix build --no-link --print-build-logs $checks

      - name: Build the devShell
        run: nix develop --command true

      - name: Install the reference client's dependencies
        run: nix develop --command bash -c 'cd reference/ledgerd-client && bun install --frozen-lockfile'

      # The throwaway Postgres runs as the (unprivileged) runner user, inside the
      # devShell's TMPDIR, on a unix socket only: no service container, no TCP.
      - name: scripts/check.sh
        run: nix develop --command scripts/check.sh

  # Spec 05 §14 AT-V*: services.hasala booted in a NixOS VM (own Postgres,
  # migrations, the API on loopback, nothing on 0.0.0.0, the console's kernel
  # rule and header refusals, encrypted backups). Informational: it is not a
  # required check, so a slow or flaky runner never blocks a merge. Skipped,
  # like the jobs above, only when `changes` succeeded and said "false".
  nixos-vm:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nixos_vm != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the NixOS VM test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""
      - name: qa-vm
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.qa-vm

  # vuln-weekly.yml runs the same scan on main every week.
  vuln:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      # govulncheck exits non-zero when any vulnerability is reachable from the
      # code (symbol-level, its default); imported-but-unreachable ones are
      # reported without failing.
      - name: govulncheck ./... (server)
        run: nix develop --command bash -c 'cd server && govulncheck ./...'

      # server/oracle is a separate Go module (spec 02 §4.3) that the scan above
      # never reaches; excelize and modernc.org/sqlite live only there.
      - name: govulncheck ./... (server/oracle)
        run: nix develop --command bash -c 'cd server/oracle && govulncheck ./...'

  # Runs on every pull request and push, whatever changed: it does not wait
  # for `changes`.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip: a secret added and then deleted in a
          # later commit is still published.
          fetch-depth: 0
          persist-credentials: false

      # `gate` runs the fence and the HasalaCore lints too, but `gate` is
      # skipped when nothing it reads changed (an ios/-only pull request, for
      # one), and `swift` is not a required check; here they run on every pull
      # request. Bash, grep and awk only: no toolchain, a few seconds.
      - name: Real-mail fence
        run: scripts/check.sh --fence-only

      - name: HasalaCore import and API lints
        run: |
          ios/scripts/check-imports.sh --no-manifest
          ios/scripts/check-forbidden.sh

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""

      # gitleaks from the flake's pinned nixpkgs (flake.lock), so its version
      # moves only with the lock. --redact: this log is public.
      # --log-opts=HEAD: every commit reachable from the checked-out commit (on
      # a pull request, the merge of the branch into main; on a push, main),
      # judged by that commit's .gitleaks.toml. Without it gitleaks runs
      # `git log --all`, and fetch-depth 0 fetches every branch, so one open
      # branch's allowlisted test vectors failed every other run against a
      # .gitleaks.toml that had not seen them yet. Every branch with a pull
      # request is still scanned in full by that pull request's run; a branch
      # with none is not scanned here (GitHub secret scanning still covers
      # provider patterns). Keep the revision one that cannot fail to resolve:
      # gitleaks 8.30.1 exits 0 with "0 commits scanned" when git log fails.
      - name: gitleaks
        run: >-
          nix shell --inputs-from . nixpkgs#gitleaks --command
          gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact --verbose --no-banner .

  # The iOS app (ios/): token generator freshness, the HasalaKit package tests on
  # macOS, then a simulator build with the unit and UI smoke tests. Nothing is
  # signed here (CODE_SIGNING_ALLOWED=NO) and no Apple credential exists in CI;
  # archives, signing and uploads happen only on the owner's Mac
  # (ios/scripts/archive.sh, ios/scripts/upload.sh). Not a required check.
  # The app is built with the newest Xcode on the image (spec 06: Xcode 27).
  ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Design tokens are generated from design/tokens/paper-tokens.json
        run: swift ios/tools/tokens/generate.swift --check

      - name: No Swift file references in the project (synchronized folders only)
        run: |
          if grep -q 'lastKnownFileType = sourcecode.swift' ios/Hasala.xcodeproj/project.pbxproj; then
            echo "::error::ios/Hasala.xcodeproj lists Swift files; every target root must be a synchronized folder"
            exit 1
          fi

      # XcodeGen 2.46.0 from the flake (packages.aarch64-darwin.xcodegen, pinned
      # by hash): only that one package is built, not the devShell. A missing
      # or different XcodeGen fails the step (generate-project.sh exits 2).
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""

      - name: Project matches ios/project.yml (XcodeGen 2.46.0, AT-01)
        run: |
          xcodegen="$(nix build .#xcodegen --no-link --print-out-paths)/bin/xcodegen"
          XCODEGEN="$xcodegen" ios/scripts/generate-project.sh --check

      - name: Release script tests (build numbers, upload prechecks; offline)
        run: |
          ios/scripts/tests/build_number_test.sh
          ios/scripts/tests/upload_precheck_test.sh

      - name: HasalaKit tests (macOS)
        run: swift test --package-path ios/HasalaKit

      - name: Build and test in the simulator (unsigned)
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          rts = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in rts.items():
              if ".iOS-" not in rt:
                  continue
              ver = tuple(int(x) for x in rt.rsplit(".iOS-", 1)[1].split("-"))
              if ver < (26,):
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and (best is None or ver > best[0]):
                      best = (ver, d["udid"], d["name"])
          if best is None:
              sys.exit("no iPhone simulator with iOS 26 or later")
          print(best[1])
          ')"
          xcrun simctl list devices | grep "$udid"
          xcodebuild test \
            -project ios/Hasala.xcodeproj -scheme Hasala \
            -destination "id=$udid" \
            -resultBundlePath "$RUNNER_TEMP/Hasala.xcresult" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/Hasala.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # HasalaCore (ios/HasalaCore): every module builds for macOS and iOS and
  # `swift test` passes (unit tests and the conformance suite, reading
  # conformance/ in place). No private fixtures here either: the real-corpus
  # test skips by name. The package's platforms are iOS 26 / macOS 26 and its
  # tools version is 6.2, so the image is pinned to macOS 26 and the Xcode is
  # chosen by path, never by whatever the image's default is that week.
  # --disable-automatic-resolution: Package.resolved is the pin, and a
  # manifest that disagrees with it fails instead of resolving afresh.
  swift:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift != 'false') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version

      - name: swift test
        working-directory: ios/HasalaCore
        run: swift test --disable-automatic-resolution

      # `swift test` builds for macOS only. The iOS build is what catches a
      # module that shadows an Apple framework (the reason `CoreText` is
      # `HasalaText`) or code that only compiles on the Mac.
      - name: Build for iOS (simulator and device)
        working-directory: ios/HasalaCore
        run: |
          for dest in 'generic/platform=iOS Simulator' 'generic/platform=iOS'; do
            xcodebuild -scheme HasalaCore-Package -destination "$dest" \
              -derivedDataPath "$RUNNER_TEMP/dd" -disableAutomaticPackageResolution \
              -quiet build
          done

      # The import allowlist, AT-C11 and the grep lints run in `gate` and `secrets` too; here
      # check-imports.sh also compares imports.allow with Package.swift.
      - name: Import rules and grep lints
        run: ios/scripts/check-imports.sh && ios/scripts/check-forbidden.sh

  # The hasala.app website in web/ (Astro + Bun). Not a required check: the
  # ruleset is the owner's. Lighthouse uses the Node and Chrome that come with
  # the runner image and keeps its reports in a workflow artifact only (never
  # temporary-public-storage). Nothing here deploys.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true
          diagnostic-endpoint: ""

      - name: Install the site's dependencies
        run: >-
          nix develop --command bash -c
          'cd web && bun install --frozen-lockfile && cd lighthouse && bun install --frozen-lockfile'

      - name: astro check
        run: nix develop --command bash -c 'cd web && bun run check'

      # `bun run build` is astro build followed by scripts/check-dist.ts: one
      # CSP covering every inline script and style, no style="" attributes,
      # and the JS budget on / (15 KB gzip).
      - name: Build, CSP and JS-budget checks
        run: nix develop --command bash -c 'cd web && bun run build'

      # Serves dist/ on 127.0.0.1 (scripts/serve-dist.ts) and asserts the
      # category scores in web/lighthouse/lighthouserc.json, mobile and desktop.
      - name: Lighthouse CI
        run: nix develop --command web/lighthouse/run.sh "$RUNNER_TEMP/lighthouse"

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: warn
          retention-days: 14
