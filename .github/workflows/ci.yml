# CI for the public tree. It runs WITHOUT the private fixtures
# (HASALA_PRIVATE_FIXTURES is never set here and no private repository is
# fetched), so the real-corpus tests skip by name and scripts/check.sh says how
# many; that is expected. See CLAUDE.md, "Build and test".
#
# The required jobs' ids are also their check names (no `name:` override, no
# matrix): required status checks match `ci-ok` (and, until the ruleset drops
# them, `gate`, `vuln` and `secrets`) by name, so renaming a job silently drops
# it from the requirement. `swift` (the Swift
# client core on a Mac), `ios-build` (the app built once for testing), `ios`
# (three UI test shards on that build), `ios-tools` (HasalaKit, the iOS
# project, token and release-script checks on a Mac), `web` (the website) and
# `nixos-vm` (the QA module booted in a NixOS VM) are not required checks.
#
# Path-aware, failing closed: the first job, `changes`, lists the files the
# pull request (or the push to main) changes, and `gate`, `vuln`, `swift`,
# `ios-build`, `ios`, `ios-tools`, `web` and `nixos-vm` are skipped only when
# every one of them is on that job's list of paths it does not read. Any other
# path runs the job, a path nobody anticipated included. `secrets` always runs.
# Jobs are skipped with a job-level `if:`, never a workflow-level `paths:`
# filter: a skipped job still reports its check, as "skipped", which a required
# check counts as passing, whereas a workflow that never starts leaves its
# required checks pending forever. If `changes` does not succeed, every job
# runs. A push to main is path-aware the same way, against the commit main was
# at before the push: the pull request already ran every job on exactly what
# merged (main requires a branch to be up to date), so a push that does not
# touch a job's paths skips it. A manual run (workflow_dispatch) runs every
# job. A newer push to main cancels an older push's Mac jobs (see
# "concurrency" below). The weekly govulncheck of main is a separate workflow,
# vuln-weekly.yml, so that its run never records checks on main's head.
#
# Every action is pinned to a full commit SHA, with its release in a comment.
#
# Caches (actions/cache): Go's module and build caches in `gate` (`vuln` reads
# them), Bun's package cache in `gate` and `web`, and SwiftPM's repository
# cache in `swift` and `ios-build`. Each is keyed on the files that pin its
# contents (flake.lock pins Go; go.sum, bun.lock and Package.resolved the
# dependencies) and saved only when that exact key was missing. Scoping is
# what keeps a cache trustworthy: a pull request's run saves only into its own
# scope and reads main's, never another pull request's, and main reads only its
# own. Go's build cache is content-addressed (an entry is reused only for
# byte-identical inputs and toolchain); SwiftPM checks out the revision
# Package.resolved pins, from the cached clone or the network alike; and
# check.sh still runs every Go test with -count=1, so no test result is cached.
#
# Nix store (nix-community/cache-nix-action) in `gate`, `vuln`, `nixos-vm`,
# `web` and `ios-tools`: one entry of the whole /nix per job, keyed
# nix-<runner OS>-<job>-<hash of flake.lock>. Only a push to main saves it,
# and only when that exact key is missing; pull requests and manual runs only
# restore (main's entry, or the newest one of the same prefix when flake.lock
# changed). Before it saves, the job collects garbage down to
# gc-max-store-size; after it saves, it deletes main's older entries of the
# same prefix (purge, which is why these jobs have `actions: write`). So the
# Nix store is at most five entries, all on main, and none in a pull
# request's scope.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One run per pull request (a new push cancels the superseded run); every other
# run (a push to main, a manual run) is its own group, so no run is cancelled or
# dropped as a whole. The Mac jobs (`swift`, `ios-build`, `ios-tools` and each
# `ios` shard) also have a job-level group: on a push to main it is one group
# per job (and shard) with cancel-in-progress, so a newer push to main cancels
# an older push's Mac job that is still queued or running. The account runs at
# most five Mac jobs at once and every push to main asks for six, so without
# this pushes queued behind each other for hours. The newest push to main still
# runs its Mac jobs (some pull requests merge before theirs finish); a push
# that skips a Mac job by path leaves the older push's job running. Any other
# run's job-level group is its own run id, so it changes nothing there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Which jobs the pull request needs, as outputs `gate` (read by gate and
  # vuln), `swift`, `ios` (read by ios-build, ios and ios-tools),
  # `ios_scripts` (the devShell step of ios-tools), `web` and `nixos_vm`, each
  # "true" or "false". A push to main computes them the same way, from the
  # push's `before` commit to its head; any other event, or a push whose
  # `before` cannot be fetched (a new branch, a force push), sets all of them to
  # "true". The checkout of a pull request is its merge
  # commit (refs/pull/N/merge) and depth 2 fetches both parents, so
  # `git diff HEAD^1 HEAD` is exactly what merging would change on the base as
  # it is now. --no-renames lists both ends of a move, so moving a file out of
  # an area still counts for that area. -z prints every path verbatim,
  # NUL-terminated: without it git C-quotes non-ASCII and special characters
  # ("server/caf\303\251.go") and no anchored pattern matches the line.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.areas.outputs.gate }}
      swift: ${{ steps.areas.outputs.swift }}
      ios: ${{ steps.areas.outputs.ios }}
      ios_scripts: ${{ steps.areas.outputs.ios_scripts }}
      web: ${{ steps.areas.outputs.web }}
      nixos_vm: ${{ steps.areas.outputs.nixos_vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all_true() { printf '%s=true\n' "$@" | tee -a "$GITHUB_OUTPUT"; }
          changed="$RUNNER_TEMP/changed-paths"
          case "$EVENT" in
            pull_request)
              base=HEAD^1
              ;;
            push)
              # A `before` that is all zeros (a new branch) or that this clone
              # cannot fetch (a force push dropped it) runs every job.
              if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" =~ ^0+$ ]] ||
                ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
                all_true gate swift ios ios_scripts web nixos_vm
                exit 0
              fi
              base="$BEFORE"
              ;;
            *)
              all_true gate swift ios ios_scripts web nixos_vm
              exit 0
              ;;
          esac
          git diff -z --no-renames --name-only "$base" HEAD >"$changed"
          echo "::group::$(tr -cd '\0' <"$changed" | wc -c) changed path(s)"
          # The paths come from the pull request: between these two lines, a
          # line that starts with "::" is printed, not run as a command.
          token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$token"
          tr '\0' '\n' <"$changed"
          echo "::$token::"
          echo "::endgroup::"
          # skip_unless NAME INERT [READS]: NAME=false only when every changed
          # path matches INERT (paths NAME does not read) and none matches
          # READS (paths under INERT that NAME does read); otherwise true. An
          # empty diff is false. grep -z matches each NUL-terminated path.
          # grep exits 2 on an error (a malformed pattern): fail the step, so
          # `changes` is not 'success' and every job runs.
          match() { local rc=0; grep -zEq "$@" "$changed" || rc=$?; ((rc < 2)) || exit "$rc"; return "$rc"; }
          skip_unless() {
            local v=false
            if match -v -- "$2" || { [[ -n "${3:-}" ]] && match -- "$3"; }; then
              v=true
            fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          # Read by no job: the licence texts, NOTICE, root Markdown, design
          # assets and the private-fixtures pin (read only when
          # HASALA_PRIVATE_FIXTURES is set, which CI never does).
          none='^(LICENSES|design)/|^[^/]+\.md$|^(NOTICE|private-fixtures\.lock)$'
          # gate and vuln: docs/, web/ and ios/ are not read, except any *.go
          # or *.nix (the flake's formatting check covers them wherever they
          # are) and any go.mod, go.sum, go.work or go.work.sum. check.sh also
          # runs the HasalaCore lints over ios/, but `secrets` runs them too.
          # infra/ is read (nix flake check evaluates and builds its checks).
          skip_unless gate "$none|^(docs|web|ios)/" '\.(go|nix)$|(^|/)go\.(mod|sum|work|work\.sum)$'
          # swift reads ios/ and conformance/ only.
          skip_unless swift "$none|^(docs|web|server|reference|scripts|infra)/|^(flake\.nix|flake\.lock|\.gitleaks\.toml)$"
          # ios-build, ios and ios-tools read ios/, design/ (the Paper tokens
          # the app is generated from) and the flake (which pins its XcodeGen).
          skip_unless ios '^LICENSES/|^[^/]+\.md$|^(NOTICE|private-fixtures\.lock)$|^(docs|web|server|conformance|reference|scripts|infra)/|^\.gitleaks\.toml$'
          # ios-tools' devShell step reads ios/scripts/ and the flake only.
          skip_unless ios_scripts "$none|^(docs|web|ios|server|conformance|reference|scripts|infra)/|^\.gitleaks\.toml$" '^ios/scripts/'
          # web reads web/ and docs/legal/, and its Bun comes from the flake.
          skip_unless web "$none|^(docs|ios|server|conformance|reference|scripts|infra)/|^\.gitleaks\.toml$" '^docs/legal/'
          # nixos-vm reads infra/ (the module and the VM test), server/ (the
          # hasalad it boots) and the flake (cloudflared, PostgreSQL and the
          # nixpkgs it builds them from).
          skip_unless nixos_vm "$none|^(docs|web|ios|conformance|reference|scripts)/|^\.gitleaks\.toml$"

  # A skipped required job reports "skipped", which passes. Each job below is
  # skipped only when `changes` succeeded and said "false".
  gate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No separate real-mail fence step here: `secrets` runs it alone on every
      # push and pull request, without waiting for `changes` or a toolchain, and
      # check.sh below runs it again as its own first step.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-gate-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-gate-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 6G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-gate-
          purge-created: 0
          purge-primary-key: never

      # Every check is evaluated, and every check except the NixOS VM test is
      # built. The VM test needs KVM and minutes; it has its own job below
      # (nixos-vm), which is not a required check. The two are independent Nix
      # runs, each mostly one evaluation thread, so they run side by side: each
      # one's output is printed in its own group once both have finished, and
      # the step fails if either failed.
      - name: nix flake check (evaluate everything; build every check but qa-vm)
        run: |
          set -euo pipefail
          checks="$(nix eval --json .#checks.x86_64-linux --apply 'cs: builtins.attrNames (removeAttrs cs [ "qa-vm" ])' \
            | jq -r '.[] | ".#checks.x86_64-linux." + .')"
          echo "$checks"
          logs="$RUNNER_TEMP/nix-check-logs"
          mkdir -p "$logs"
          # bg LOG COMMAND...: COMMAND in the background, its output and time in LOG.
          bg() {
            local log="$1"
            shift
            (
              start=$SECONDS rc=0
              "$@" >"$log" 2>&1 || rc=$?
              echo "(exit $rc after $((SECONDS - start)) s)" >>"$log"
              exit "$rc"
            ) &
          }
          bg "$logs/evaluate" nix flake check --no-build
          evaluate=$!
          # shellcheck disable=SC2086 # one installable per word
          bg "$logs/build" nix build --no-link --print-build-logs $checks
          build=$!
          failed=0
          for run in "evaluate:$evaluate:nix flake check --no-build" "build:$build:nix build of every check but qa-vm"; do
            IFS=: read -r log pid what <<<"$run"
            rc=0
            wait "$pid" || rc=$?
            echo "::group::$what (exit $rc)"
            cat "$logs/$log"
            echo "::endgroup::"
            if [[ "$rc" != 0 ]]; then
              echo "::error::$what failed (exit $rc)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build the devShell
        run: nix develop --command true

      - name: Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-gate-${{ runner.os }}-${{ hashFiles('reference/ledgerd-client/bun.lock') }}
          restore-keys: bun-gate-${{ runner.os }}-

      - name: Install the reference client's dependencies
        run: nix develop --command bash -c 'cd reference/ledgerd-client && bun install --frozen-lockfile'

      # Modules and compiled packages of server/ and server/oracle/ (see
      # "Caches" above): without it check.sh compiles every dependency first.
      # Only this job saves it; `vuln` reads it.
      - name: Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-gate-${{ runner.os }}-${{ hashFiles('flake.lock', 'server/go.sum', 'server/oracle/go.sum') }}
          restore-keys: go-gate-${{ runner.os }}-

      # The throwaway Postgres runs as the (unprivileged) runner user, inside the
      # devShell's TMPDIR, on a unix socket only: no service container, no TCP.
      - name: scripts/check.sh
        run: nix develop --command scripts/check.sh

  # Spec 05 §14 AT-V*: services.hasala booted in a NixOS VM (own Postgres,
  # migrations, the API on loopback, nothing on 0.0.0.0, the console's kernel
  # rule and header refusals, encrypted backups). Informational: it is not a
  # required check, so a slow or flaky runner never blocks a merge. Skipped,
  # like the jobs above, only when `changes` succeeded and said "false".
  nixos-vm:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nixos_vm != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the NixOS VM test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-nixos-vm-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-nixos-vm-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 6G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-nixos-vm-
          purge-created: 0
          purge-primary-key: never
      - name: qa-vm
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.qa-vm

  # vuln-weekly.yml runs the same scan on main every week.
  vuln:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-vuln-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-vuln-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 6G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-vuln-
          purge-created: 0
          purge-primary-key: never

      # The modules govulncheck loads, and their compiled export data: `gate`'s
      # cache (see "Caches" above), read only. Saving here would race `gate`
      # for the key with a smaller cache.
      - name: Go module and build caches (gate's, read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-gate-${{ runner.os }}-${{ hashFiles('flake.lock', 'server/go.sum', 'server/oracle/go.sum') }}
          restore-keys: go-gate-${{ runner.os }}-

      # govulncheck exits non-zero when any vulnerability is reachable from the
      # code (symbol-level, its default); imported-but-unreachable ones are
      # reported without failing.
      - name: govulncheck ./... (server)
        run: nix develop --command bash -c 'cd server && govulncheck ./...'

      # server/oracle is a separate Go module (spec 02 §4.3) that the scan above
      # never reaches; excelize and modernc.org/sqlite live only there.
      - name: govulncheck ./... (server/oracle)
        run: nix develop --command bash -c 'cd server/oracle && govulncheck ./...'

  # Runs on every pull request and push, whatever changed: it does not wait
  # for `changes`.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip: a secret added and then deleted in a
          # later commit is still published.
          fetch-depth: 0
          persist-credentials: false

      # `gate` runs the fence and the HasalaCore lints too, but `gate` is
      # skipped when nothing it reads changed (an ios/-only pull request, for
      # one), and `swift` is not a required check; here they run on every pull
      # request. Bash, grep and awk only: no toolchain, a few seconds.
      - name: Real-mail fence
        run: scripts/check.sh --fence-only

      - name: HasalaCore import and API lints
        run: |
          ios/scripts/check-imports.sh --no-manifest
          ios/scripts/check-forbidden.sh

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""

      # gitleaks from the flake's pinned nixpkgs (flake.lock), so its version
      # moves only with the lock. --redact: this log is public.
      # --log-opts=HEAD: every commit reachable from the checked-out commit (on
      # a pull request, the merge of the branch into main; on a push, main),
      # judged by that commit's .gitleaks.toml. Without it gitleaks runs
      # `git log --all`, and fetch-depth 0 fetches every branch, so one open
      # branch's allowlisted test vectors failed every other run against a
      # .gitleaks.toml that had not seen them yet. Every branch with a pull
      # request is still scanned in full by that pull request's run; a branch
      # with none is not scanned here (GitHub secret scanning still covers
      # provider patterns). Keep the revision one that cannot fail to resolve:
      # gitleaks 8.30.1 exits 0 with "0 commits scanned" when git log fails.
      - name: gitleaks
        run: >-
          nix shell --inputs-from . nixpkgs#gitleaks --command
          gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact --verbose --no-banner .

  # The iOS checks that need neither the app build nor a simulator: the
  # HasalaKit package tests (macOS, the newest Xcode), token generator
  # freshness, the project against ios/project.yml, the release-script tests
  # (with the system's tools, and again inside the Nix devShell, where GNU
  # coreutils come first on PATH, when ios/scripts/ or the flake changed) and
  # shellcheck. On a runner of its own beside `ios-build`. Skipped exactly when
  # `ios-build` is. Nothing is signed for distribution here (the script tests
  # sign a synthetic app ad hoc) and no Apple credential exists in CI; archives,
  # signing and uploads happen only on the owner's Mac (ios/scripts/archive.sh,
  # ios/scripts/upload.sh). Not a required check.
  ios-tools:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    concurrency:
      group: ci-mac-ios-tools-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: HasalaKit tests (macOS)
        run: swift test --package-path ios/HasalaKit

      - name: Design tokens are generated from design/tokens/paper-tokens.json
        run: swift ios/tools/tokens/generate.swift --check

      - name: No Swift file references in the project (synchronized folders only)
        run: |
          if grep -q 'lastKnownFileType = sourcecode.swift' ios/Hasala.xcodeproj/project.pbxproj; then
            echo "::error::ios/Hasala.xcodeproj lists Swift files; every target root must be a synchronized folder"
            exit 1
          fi

      # XcodeGen 2.46.0 from the flake (packages.aarch64-darwin.xcodegen, pinned
      # by hash). A missing or different XcodeGen fails the step
      # (generate-project.sh exits 2). The darwin devShell is built too, for the
      # release-script tests below.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-ios-tools-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ios-tools-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 4G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-ios-tools-
          purge-created: 0
          purge-primary-key: never

      - name: Project matches ios/project.yml (XcodeGen 2.46.0, AT-01)
        run: |
          xcodegen="$(nix build .#xcodegen --no-link --print-out-paths)/bin/xcodegen"
          XCODEGEN="$xcodegen" ios/scripts/generate-project.sh --check

      # Offline: fake keys, a stub xcodebuild and a stub xcrun (altool never
      # runs), synthetic .ipa files, and a temporary build directory.
      - name: Release script tests (build numbers, keys, prechecks, inspection; offline)
        run: ios/scripts/tests/run.sh

      # The owner's shell is the devShell (.envrc: use flake), where GNU stat and
      # date come first on PATH; the scripts must work there too. Only when
      # `changes` says ios/scripts/ or the flake changed, or did not succeed.
      - name: Release script tests in the Nix devShell (GNU coreutils first)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.ios_scripts != 'false' }}
        run: ios/scripts/tests/devshell_test.sh

      - name: shellcheck the iOS scripts
        run: >-
          nix shell --inputs-from . nixpkgs#shellcheck --command
          shellcheck -S warning ios/scripts/*.sh ios/scripts/tests/*.sh

  # The app built once for testing (ci-simulator-test.sh --build-only), for the
  # `ios` shards to test without building. The products go to the next jobs as
  # a tar, which keeps their file modes and symlinks; the artifact lives a day.
  # It picks the simulator as the shards do, on the same runner image, so the
  # build matches the simulator they test on. Not a required check.
  # The app is built with the newest Xcode on the image (spec 06: Xcode 27).
  ios-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    concurrency:
      group: ci-mac-ios-build-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The SwiftPM clones xcodebuild resolves the project's packages from (see
      # "Caches" above).
      - name: SwiftPM repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('ios/HasalaCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for testing (unsigned)
        run: ios/scripts/ci-simulator-test.sh --build-only "$RUNNER_TEMP/dd"

      - name: Pack the test products
        run: |
          tar -C "$RUNNER_TEMP/dd" -cf "$RUNNER_TEMP/ios-products.tar" Build/Products
          ls -lh "$RUNNER_TEMP/ios-products.tar"

      - name: Keep the test products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-products
          path: ${{ runner.temp }}/ios-products.tar
          retention-days: 1
          if-no-files-found: error

  # The unit tests and the UI tests of `ios-build`'s products, without building
  # (ci-simulator-test.sh --from-build), in three shards of about 40 minutes
  # each, on three runners side by side. Shards 1 and 2 name their classes;
  # shard 3 skips those, so a class added later runs there. Each shard runs
  # the unit tests (HasalaTests, seconds) first: their host app is the
  # simulator's first launch, so no UI test is (a UI test that was once timed
  # out launching the app on a freshly booted simulator). A failed test runs
  # once more; one that passes then is a warning, one that fails twice fails
  # the shard. Runs only when `ios-build` succeeded. Not a required check.
  ios:
    needs: [changes, ios-build]
    if: ${{ !cancelled() && needs.ios-build.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    name: ios (${{ matrix.shard }})
    concurrency:
      group: ci-mac-ios-${{ matrix.shard }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 1
            selectors: >-
              -only-testing:HasalaTests
              -only-testing:HasalaUITests/PlanUITests
              -only-testing:HasalaUITests/MailboxUITests
              -only-testing:HasalaUITests/ProfileUITests
              -only-testing:HasalaUITests/HomePeriodTests
              -only-testing:HasalaUITests/SetupUITests
              -only-testing:HasalaUITests/ReleaseSurfaceHomeTests
          - shard: 2
            selectors: >-
              -only-testing:HasalaTests
              -only-testing:HasalaUITests/CoreScreensTests
              -only-testing:HasalaUITests/SignInSecurityUITests
              -only-testing:HasalaUITests/SmokeTests
              -only-testing:HasalaUITests/HomeWidgetsEditTests
              -only-testing:HasalaUITests/ReleaseSurfaceProfileTests
              -only-testing:HasalaUITests/TabRoundTripTests
              -only-testing:HasalaUITests/ReleaseSurfaceInsightsTests
          - shard: 3
            selectors: >-
              -skip-testing:HasalaUITests/PlanUITests
              -skip-testing:HasalaUITests/MailboxUITests
              -skip-testing:HasalaUITests/ProfileUITests
              -skip-testing:HasalaUITests/HomePeriodTests
              -skip-testing:HasalaUITests/SetupUITests
              -skip-testing:HasalaUITests/ReleaseSurfaceHomeTests
              -skip-testing:HasalaUITests/CoreScreensTests
              -skip-testing:HasalaUITests/SignInSecurityUITests
              -skip-testing:HasalaUITests/SmokeTests
              -skip-testing:HasalaUITests/HomeWidgetsEditTests
              -skip-testing:HasalaUITests/ReleaseSurfaceProfileTests
              -skip-testing:HasalaUITests/TabRoundTripTests
              -skip-testing:HasalaUITests/ReleaseSurfaceInsightsTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Get the test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-products
          path: ${{ runner.temp }}

      - name: Unpack the test products
        run: |
          mkdir -p "$RUNNER_TEMP/dd"
          tar -C "$RUNNER_TEMP/dd" -xf "$RUNNER_TEMP/ios-products.tar"

      - name: Test shard ${{ matrix.shard }} in the simulator (unsigned, no build)
        env:
          SELECTORS: ${{ matrix.selectors }}
        run: |
          read -r -a selectors <<<"$SELECTORS"
          ios/scripts/ci-simulator-test.sh --from-build "$RUNNER_TEMP/dd" "$RUNNER_TEMP/Hasala.xcresult" "${selectors[@]}"

      - name: List the failed tests
        if: failure()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="$RUNNER_TEMP/failed-tests/shard-$SHARD.md"
          mkdir -p "$RUNNER_TEMP/failed-tests"
          listed=""
          if [[ -d "$RUNNER_TEMP/Hasala.xcresult" ]]; then
            listed="$(xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/Hasala.xcresult" | python3 -c '
          import json, sys
          def walk(node, path):
              name = node.get("name", "")
              kind = node.get("nodeType", "")
              if kind == "Test Case":
                  if node.get("result") == "Failed":
                      print("- " + chr(96) + "/".join(path + [name]) + chr(96))
                  return
              if kind in ("Unit test bundle", "UI test bundle", "Test Suite"):
                  path = path + [name]
              for child in node.get("children", []):
                  walk(child, path)
          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node, [])
          ')" || listed=""
          fi
          {
            echo "### ios ($SHARD)"
            echo
            echo "${listed:-- No failed test in the result bundle; see the job log.}"
            echo
          } >"$out"
          cat "$out"

      - name: Keep the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-failed-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed-tests
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/Hasala.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ios-main-red:
    needs: [ios-build, ios]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: ci-main-red
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD: ${{ needs.ios-build.result }}
      IOS: ${{ needs.ios.result }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Get the failed tests
        if: ${{ needs.ios.result == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ios-failed-tests-*
          merge-multiple: true
          path: ${{ runner.temp }}/failed-tests

      - name: Open, update or close the ci-main-red issue
        run: |
          set -euo pipefail
          echo "ios-build: $BUILD, ios: $IOS"
          if [[ "$BUILD" == failure || "$IOS" == failure ]]; then
            state=red
          elif [[ "$IOS" == success ]]; then
            state=green
          else
            echo "No shard result to act on."
            exit 0
          fi
          issue="$(gh issue list --label ci-main-red --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ "$state" == green ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Every \`ios\` shard passed on \`main\` at $SHA: $RUN_URL"
            fi
            exit 0
          fi
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The \`ios\` UI tests fail on \`main\` at $SHA."
            echo
            echo "Run: $RUN_URL"
            echo
            if [[ "$BUILD" == failure ]]; then
              echo "\`ios-build\` failed, so no shard ran."
              echo
            fi
            shopt -s nullglob
            files=("$RUNNER_TEMP"/failed-tests/*.md)
            if ((${#files[@]})); then
              cat "${files[@]}"
            elif [[ "$IOS" == failure ]]; then
              echo "No list of failed tests was kept; see the run."
            fi
            echo
            echo "This issue closes when a later push to \`main\` passes every \`ios\` shard."
          } >"$body"
          cat "$body"
          gh label create ci-main-red --color B60205 --description "CI on main is red" --force
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body-file "$body"
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --title "CI on main is red: ios UI tests" --label ci-main-red --body-file "$body"
          fi

  # HasalaCore (ios/HasalaCore): every module builds for macOS and iOS and
  # `swift test` passes (unit tests and the conformance suite, reading
  # conformance/ in place). No private fixtures here either: the real-corpus
  # test skips by name. The package's platforms are iOS 26 / macOS 26 and its
  # tools version is 6.2, so the image is pinned to macOS 26 and the Xcode is
  # chosen by path, never by whatever the image's default is that week.
  # --disable-automatic-resolution: Package.resolved is the pin, and a
  # manifest that disagrees with it fails instead of resolving afresh.
  swift:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift != 'false') }}
    concurrency:
      group: ci-mac-swift-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version

      - name: SwiftPM repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('ios/HasalaCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Each test target declares what it imports (Package.swift links
      # CoreTestSupport only where a test uses it), and the import check makes an
      # undeclared import an error here too, not only under explicit module builds.
      - name: swift test
        working-directory: ios/HasalaCore
        run: swift test --disable-automatic-resolution --explicit-target-dependency-import-check error

      # `swift test` builds for macOS only. The iOS build is what catches a
      # module that shadows an Apple framework (the reason `CoreText` is
      # `HasalaText`) or code that only compiles on the Mac. One xcodebuild for
      # both destinations: the same products as one run per destination, with
      # one package resolution and build description instead of two.
      - name: Build for iOS (simulator and device)
        working-directory: ios/HasalaCore
        run: >-
          xcodebuild -scheme HasalaCore-Package
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -disableAutomaticPackageResolution
          -quiet build

      # The import allowlist, AT-C11 and the grep lints run in `gate` and `secrets` too; here
      # check-imports.sh also compares imports.allow with Package.swift.
      - name: Import rules and grep lints
        run: ios/scripts/check-imports.sh && ios/scripts/check-forbidden.sh

  # The hasala.app website in web/ (Astro + Bun). Not a required check: the
  # ruleset is the owner's. Lighthouse uses the devShell's Node and the Chrome
  # that comes with the runner image, and keeps its reports in a workflow
  # artifact only (never temporary-public-storage). Nothing here deploys.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-web-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-web-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 6G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-web-
          purge-created: 0
          purge-primary-key: never

      - name: Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-web-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/lighthouse/bun.lock') }}
          restore-keys: bun-web-${{ runner.os }}-

      - name: Install the site's dependencies
        run: >-
          nix develop --command bash -c
          'cd web && bun install --frozen-lockfile && cd lighthouse && bun install --frozen-lockfile'

      - name: astro check
        run: nix develop --command bash -c 'cd web && bun run check'

      # `bun run build` is astro build followed by scripts/check-dist.ts: one
      # CSP covering every inline script and style, no style="" attributes,
      # and the JS budget on / (15 KB gzip).
      - name: Build, CSP and JS-budget checks
        run: nix develop --command bash -c 'cd web && bun run build'

      # Serves dist/ on 127.0.0.1 (scripts/serve-dist.ts) and asserts the
      # category scores in web/lighthouse/lighthouserc.json, mobile and desktop.
      - name: Lighthouse CI
        run: nix develop --command web/lighthouse/run.sh "$RUNNER_TEMP/lighthouse"

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: warn
          retention-days: 14

  ci-ok:
    needs: [changes, gate, nixos-vm, vuln, secrets, ios-tools, ios-build, swift, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "::error::not successful: $bad"
            exit 1
          fi
