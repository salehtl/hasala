      <circle cx="512" cy="538.2" r="184" fill="#C98A1E"/>
      <circle cx="512" cy="519.8" r="184" fill="url(#hasala-wm-coin)"/>
      <circle cx="512" cy="519.8" r="139.8" fill="none" stroke="#C98A1E" stroke-opacity="0.5" stroke-width="10.1"/>
